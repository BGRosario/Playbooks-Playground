---

- hosts: all
  become: true 
  tasks:

  - name: install httpd/apache packages with dependencies
    dnf: 
      name: httpd 
      state: latest
      update_cache: yes


  - name: Start and enable httpd service
    service:
      name: httpd
      state: started
      enabled: yes

  - name: Allow HTTP
    firewalld:
      service: http
      permanent: true
      state: enabled
      immediate: true
