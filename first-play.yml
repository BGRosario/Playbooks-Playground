---

- name: Add default packages
  hosts: all
  become: true 
  tags: 
    - newborn

  tasks:
  - name: Ensure default packcages are installed (OS Rocky)
    ansible.builtin.dnf: 
      name: 
            - net-tools
            - curl
            - wget
            - vim
            - htop
            - bash-completion
            - rsync
      state: present
      update_cache: yes
    when: ansible_distribution_version == "Rocky"

  - name: Ensure default packcages are installed (OS Ubuntu)
    ansible.builtin.apt: 
      name: 
            - net-tools
            - curl
            - wget
            - vim
            - htop
            - bash-completion
            - rsync
      state: present
      update_cache: yes
    when: ansible_distribution_version == "Ubuntu"

- hosts: web-servers
  become: true
  tasks:

  - name: install httpd/apache packages with dependencies
    ansible.builtin.dnf: 
      name: httpd 
      state: latest
      update_cache: yes

  - name: Start and enable httpd service
    service:
      name: httpd
      state: started
      enabled: yes

  - name: Allow HTTP
    firewalld:
      service: http
      permanent: true
      state: enabled
      immediate: true
